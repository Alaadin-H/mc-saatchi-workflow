name: Build CoreStudio (iPad)

on:
  workflow_dispatch:
  push:
    paths:
      - "CoreStudio/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: CoreStudio
        run: xcodegen generate

      - name: Build for iPad (unsigned)
        working-directory: CoreStudio
        run: |
          set -o pipefail
          xcodebuild \
            -project CoreStudio.xcodeproj \
            -scheme CoreStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned .ipa
        working-directory: CoreStudio
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CoreStudio.app Payload/
          zip -qry CoreStudio-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: CoreStudio-unsigned-ipa
          path: CoreStudio/CoreStudio-unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: CoreStudio/xcodebuild.log
